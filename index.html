<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Luminer | Sustainable Luxury</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

<style>
:root {
    --accent: #e88fa6;
    --bg: #fdf2f5;
    --glass: rgba(255,255,255,0.5);
}

* {margin:0;padding:0;box-sizing:border-box;}

body {
    font-family: 'Inter', sans-serif;
    background: var(--bg);
    overflow-x:hidden;
}

/* NAV */
nav {
    position: fixed;
    width:100%;
    display:flex;
    justify-content:space-between;
    padding:20px 5%;
    backdrop-filter: blur(20px);
    background: rgba(255,255,255,0.4);
    z-index:1000;
}

.logo {
    font-family:'Playfair Display';
    font-size:22px;
    letter-spacing:3px;
}
.logo span {
    display:block;
    font-size:10px;
    letter-spacing:4px;
    color:#888;
}

.cart-btn {
    background:white;
    padding:10px 18px;
    border-radius:30px;
    cursor:pointer;
    transition:0.3s;
}
.cart-btn:hover {transform:scale(1.05);}

/* HERO */
header {
    height:100vh;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
    padding:0 10%;
}

h1 {
    font-family:'Playfair Display';
    font-size:clamp(3rem,6vw,5rem);
    background: linear-gradient(135deg,#ff9a9e,#fecfef);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}

.hero-text {
    max-width:600px;
    color:#666;
    margin:20px 0;
}

/* BUTTON */
.btn {
    padding:14px 35px;
    border-radius:30px;
    border:none;
    background: linear-gradient(135deg,#ff9a9e,#fecfef);
    color:white;
    cursor:pointer;
    transition:0.3s;
}
.btn:hover {transform:scale(1.05);}

/* GRID */
.shop {
    padding:80px 5%;
}
.grid {
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
    gap:30px;
}

/* CARD */
.card {
    background:var(--glass);
    backdrop-filter:blur(15px);
    border-radius:25px;
    padding:20px;
    transition:0.4s;
    transform:translateY(40px);
    opacity:0;
}

.card.show {
    transform:translateY(0);
    opacity:1;
}

.card:hover {
    transform:translateY(-15px) scale(1.03);
}

.card img {
    width:100%;
    height:260px;
    object-fit:cover;
    border-radius:15px;
}

.price {
    font-weight:700;
    margin:10px 0;
}

/* TIMER */
.timer {
    font-size:12px;
    color:var(--accent);
    margin-bottom:10px;
}

/* CART */
#cart {
    position:fixed;
    right:-400px;
    top:0;
    width:350px;
    height:100%;
    background:white;
    transition:0.4s;
    padding:20px;
    z-index:2000;
}
#cart.open {right:0;}

.cart-item {
    display:flex;
    gap:10px;
    margin-bottom:15px;
}

/* FOOTER */
footer {
    text-align:center;
    padding:40px;
    color:#888;
}
</style>
</head>

<body>

<nav>
    <div class="logo">
        Luminer
        <span>SUSTAINABLE LUXURY</span>
    </div>
    <div class="cart-btn" onclick="toggleCart()">
        Cart (<span id="count">0</span>)
    </div>
</nav>

<header>
    <h1>Luminer Totes</h1>
    <p class="hero-text">
        Crafted for conscious living. Designed for modern elegance.
    </p>
    <button class="btn" onclick="scrollToShop()">Explore</button>
</header>

<section class="shop" id="shop">
    <div class="grid" id="grid"></div>
</section>

<div id="cart">
    <h2>Your Bag</h2>
    <div id="items"></div>
    <h3>Total: ₹<span id="total">0</span></h3>
    <button class="btn" onclick="checkout()">Order via WhatsApp</button>
</div>

<footer>
    Luminer © 2026 | Sustainable Fashion
</footer>

<script>
const products = [
{ id:1,name:"Classic Blush",price:249,img:"https://images.unsplash.com/photo-1590874103328-eac38a683ce7?q=80&w=400"},
{ id:2,name:"Midnight Petal",price:249,img:"https://images.unsplash.com/photo-1544816153-36ad49bc10d8?q=80&w=400"},
{ id:3,name:"Sand Minimal",price:249,img:"https://images.unsplash.com/photo-1622560480605-d83c853bc5c3?q=80&w=400"},
];

let cart=[];

/* RENDER */
function render(){
    grid.innerHTML = products.map(p=>`
    <div class="card">
        <div class="timer">Ends in: <span class="time"></span></div>
        <img src="${p.img}">
        <h3>${p.name}</h3>
        <p class="price">₹${p.price}</p>
        <p style="font-size:12px;color:#888;">🔥 32 people viewing</p>
        <button class="btn" onclick="add(${p.id})">Add</button>
    </div>
    `).join('');

    reveal();
}

/* SCROLL ANIMATION */
function reveal(){
    document.querySelectorAll('.card').forEach((el,i)=>{
        setTimeout(()=>el.classList.add('show'), i*150);
    });
}

/* CART */
function add(id){
    const p = products.find(x=>x.id===id);
    cart.push(p);
    update();
}

function update(){
    count.innerText = cart.length;
    items.innerHTML = cart.map(i=>`<div class="cart-item">${i.name} ₹${i.price}</div>`).join('');
    total.innerText = cart.reduce((a,b)=>a+b.price,0);
}

function toggleCart(){
    cart.classList.toggle('open');
}

/* TIMER */
let time = 86400;
setInterval(()=>{
    let h=Math.floor(time/3600);
    let m=Math.floor((time%3600)/60);
    document.querySelectorAll('.time').forEach(el=>{
        el.innerText=`${h}h ${m}m`;
    });
    time--;
},1000);

/* SCROLL */
function scrollToShop(){
    document.getElementById('shop').scrollIntoView({behavior:'smooth'});
}

/* CHECKOUT */
function checkout(){
    let msg = cart.map(i=>`- ${i.name}`).join('%0A');
    window.open(`https://wa.me/919392862839?text=Hi Luminer ✨%0AI want:%0A${msg}`);
}

render();
</script>

</body>
</html>
